name: Build

# Laeuft bei jedem Push, Pull Request und neuen Tag.
# Tag v1.2.3 pushen -> EXE wird mit Version 1.2.3 gebaut und als Release veroeffentlicht.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skript pruefen (Syntax, Sprachen, XAML)
        shell: powershell
        run: .\tests\Test-Script.ps1

      - name: EXE bauen
        shell: powershell
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          .\build\build.ps1 -Version $v

      - name: EXE als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: EdenUpdater
          path: dist/EdenUpdater.exe

      # Patchnotes: Abschnitt "## <Version>" aus CHANGELOG.md. Der Updater zeigt genau diesen Text an.
      # Fehlt der Abschnitt, erzeugt GitHub die Notizen wie bisher selbst.
      - name: Patchnotes aus CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $text = [IO.File]::ReadAllText("CHANGELOG.md", [Text.Encoding]::UTF8)
          $m = [regex]::Match($text, '(?ms)^##\s*' + [regex]::Escape($ver) + '\s*\r?\n(.*?)(?=^##\s|\z)')
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }
          if ($body) {
            [IO.File]::WriteAllText("release-notes.md", $body, (New-Object Text.UTF8Encoding($false)))
            "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Release veroeffentlichen (Patchnotes aus CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EdenUpdater.exe
          body_path: release-notes.md

      - name: Release veroeffentlichen (Notizen von GitHub)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EdenUpdater.exe
          generate_release_notes: true

  # Screenshots aller Seiten in allen Themes (zum Pruefen der Oberflaeche)
  snapshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Screenshots erstellen
        shell: powershell
        run: |
          $env:EDEN_UPDATER_SNAPSHOT = Join-Path $pwd "snapshots"
          $env:EDEN_UPDATER_SNAPSHOT_THEMES = "dark-cyan,light,light-sand,dark-aurora,dark-synth,amoled-red"
          $env:EDEN_UPDATER_SNAPSHOT_FX = "1"
          .\build\merge.ps1 | Out-Null
          New-Item -ItemType Directory snapshots -Force | Out-Null
          $p = Start-Process powershell -ArgumentList '-NoProfile','-STA','-ExecutionPolicy','Bypass','-File','dist\EdenUpdater.ps1' -PassThru -RedirectStandardError snapshots\stderr.txt -RedirectStandardOutput snapshots\stdout.txt
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "Timeout" }
          Get-ChildItem snapshots | Format-Table Name, Length
          # Ausgaben des Programms: leer = nichts Unerwartetes; sonst anzeigen und den Lauf scheitern lassen
          foreach ($f in 'stderr.txt','stdout.txt') {
            $pf = Join-Path snapshots $f
            if ((Test-Path $pf) -and (Get-Item $pf).Length -eq 0) { Remove-Item $pf }
          }
          if (Test-Path snapshots\stderr.txt) { Get-Content snapshots\stderr.txt; exit 1 }
          if (Test-Path snapshots\errors.txt) { Get-Content snapshots\errors.txt; exit 1 }
          if (-not (Get-ChildItem snapshots -Filter *.png)) { exit 1 }

      - name: Screenshots ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: snapshots/

      - name: Screenshots in Branch 'screenshots' ablegen
        if: always() && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [ -d snapshots ] || exit 0
          cd snapshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots von ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
