name: Build

# Laeuft bei jedem Push, Pull Request und neuen Tag.
# Tag v1.2.3 pushen -> EXE wird mit Version 1.2.3 gebaut und als Release veroeffentlicht.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skript pruefen (Syntax, Sprachen, XAML)
        shell: powershell
        run: .\tests\Test-Script.ps1

      - name: EXE bauen
        shell: powershell
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          .\build\build.ps1 -Version $v

      - name: EXE als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: EdenUpdater
          path: dist/EdenUpdater.exe

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EdenUpdater.exe
          generate_release_notes: true

  # Screenshots aller Seiten in allen Themes (zum Pruefen der Oberflaeche)
  snapshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Screenshots erstellen
        shell: powershell
        run: |
          New-Item -ItemType Directory snapshots | Out-Null
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $out = Join-Path $pwd "snapshots\probe.txt"
          $ids = "010074F013262000","01006A800016E000","01006D0017F7A000","01006FE013472000","01007BB017812000","0100965017338000","010099C022B96000","0100ABD01785C000","0100E95004038000","0100FD8022DAA000","010015100B514000","0100453019AA8000","0100000000001234"
          foreach ($id in $ids) {
            foreach ($q in @("?fields=name,icon,publisher&lang=de")) {
              $sw = [Diagnostics.Stopwatch]::StartNew()
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri ("https://api.nlib.cc/nx/" + $id + $q) -TimeoutSec 20 -UserAgent "EdenUpdater-probe"
                Add-Content $out ("{0} {1} {2}ms {3} :: {4}" -f $id, $r.StatusCode, $sw.ElapsedMilliseconds, $r.Headers["Content-Type"], $r.Content)
              } catch { Add-Content $out ("{0} ERR {1}ms {2}" -f $id, $sw.ElapsedMilliseconds, $_.Exception.Message); try { $sr = New-Object IO.StreamReader($_.Exception.Response.GetResponseStream()); Add-Content $out ("   body: " + $sr.ReadToEnd()) } catch {} }
            }
          }
          foreach ($u in @("https://api.nlib.cc/nx/010074F013262000?lang=en","https://api.nlib.cc/nx/010074F013262000?fields=name&lang=pl","https://api.nlib.cc/nx/stats")) {
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 20; Add-Content $out ("{0} -> {1} :: {2}" -f $u, $r.StatusCode, $r.Content.Substring(0, [Math]::Min(1500, $r.Content.Length))); Add-Content $out ("   headers: " + (($r.Headers.Keys | % { $_ + "=" + $r.Headers[$_] }) -join "; ")) } catch { Add-Content $out ("{0} -> ERR {1}" -f $u, $_.Exception.Message) }
          }
          foreach ($u in @("https://api.nlib.cc/nx/010074F013262000/icon/260","https://api.nlib.cc/nx/0100000000001234/icon/260","https://api.nlib.cc/nx/01006A800016E000/icon/260")) {
            $f = Join-Path $pwd ("snapshots\icon-" + ($u -split "/")[4] + ".jpg")
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 30 -OutFile $f -PassThru; Add-Content $out ("{0} -> {1} {2} {3} bytes" -f $u, $r.StatusCode, $r.Headers["Content-Type"], (Get-Item $f).Length) } catch { Add-Content $out ("{0} -> ERR {1}" -f $u, $_.Exception.Message) }
          }
          Get-Content $out

      - name: Screenshots ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: snapshots/

      - name: Screenshots in Branch 'screenshots' ablegen
        if: always() && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [ -d snapshots ] || exit 0
          cd snapshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots von ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
