name: Build

# Laeuft bei jedem Push, Pull Request und neuen Tag.
# Tag v1.2.3 pushen -> EXE wird mit Version 1.2.3 gebaut und als Release veroeffentlicht.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skript pruefen (Syntax, Sprachen, XAML)
        shell: powershell
        run: .\tests\Test-Script.ps1

      - name: EXE bauen
        shell: powershell
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          .\build\build.ps1 -Version $v

      - name: EXE als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: EdenUpdater
          path: dist/EdenUpdater.exe

      - name: Release veroeffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EdenUpdater.exe
          generate_release_notes: true

  # Screenshots aller Seiten in allen Themes (zum Pruefen der Oberflaeche)
  snapshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Screenshots erstellen
        shell: powershell
        run: |
          $env:EDEN_UPDATER_SNAPSHOT = Join-Path $pwd "snapshots"
          $p = Start-Process powershell -ArgumentList '-NoProfile','-STA','-ExecutionPolicy','Bypass','-File','src\EdenUpdater.ps1' -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "Timeout" }
          Get-ChildItem snapshots | Format-Table Name, Length
          if (Test-Path snapshots\errors.txt) { Get-Content snapshots\errors.txt; exit 1 }
          if (-not (Get-ChildItem snapshots -Filter *.png)) { exit 1 }

      - name: Screenshots ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: snapshots/

      - name: Screenshots in Branch 'screenshots' ablegen
        if: always() && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [ -d snapshots ] || exit 0
          cd snapshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots von ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
