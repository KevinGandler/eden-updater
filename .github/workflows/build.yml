name: Build

# Laeuft bei jedem Push, Pull Request und neuen Tag.
# Tag v1.2.3 pushen -> EXE wird mit Version 1.2.3 gebaut und als Release veroeffentlicht.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skript pruefen (Syntax, Sprachen, XAML)
        shell: powershell
        run: .\tests\Test-Script.ps1

      - name: EXE bauen
        shell: powershell
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          .\build\build.ps1 -Version $v

      - name: EXE als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: EdenUpdater
          path: dist/EdenUpdater.exe

      # Patchnotes: Abschnitt "## <Version>" aus CHANGELOG.md. Der Updater zeigt genau diesen Text an.
      # Fehlt der Abschnitt, erzeugt GitHub die Notizen wie bisher selbst.
      - name: Patchnotes aus CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $text = [IO.File]::ReadAllText("CHANGELOG.md", [Text.Encoding]::UTF8)
          $m = [regex]::Match($text, '(?ms)^##\s*' + [regex]::Escape($ver) + '\s*\r?\n(.*?)(?=^##\s|\z)')
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }
          if ($body) {
            [IO.File]::WriteAllText("release-notes.md", $body, (New-Object Text.UTF8Encoding($false)))
            "found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Release veroeffentlichen (Patchnotes aus CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EdenUpdater.exe
          body_path: release-notes.md

      - name: Release veroeffentlichen (Notizen von GitHub)
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EdenUpdater.exe
          generate_release_notes: true

  # Screenshots aller Seiten in allen Themes (zum Pruefen der Oberflaeche)
  snapshots:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Screenshots erstellen
        shell: powershell
        run: |
          $env:EDEN_UPDATER_SNAPSHOT = Join-Path $pwd "snapshots"
          $env:EDEN_UPDATER_SNAPSHOT_THEMES = "dark-cyan,light,light-sand,dark-aurora,dark-synth,amoled-red"
          $env:EDEN_UPDATER_SNAPSHOT_FX = "1"
          .\build\merge.ps1 | Out-Null
          New-Item -ItemType Directory snapshots -Force | Out-Null
          $p = Start-Process powershell -ArgumentList '-NoProfile','-STA','-ExecutionPolicy','Bypass','-File','dist\EdenUpdater.ps1' -PassThru -RedirectStandardError snapshots\stderr.txt -RedirectStandardOutput snapshots\stdout.txt
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host "Timeout" }
          Get-ChildItem snapshots | Format-Table Name, Length
          # Ausgaben des Programms: leer = nichts Unerwartetes; sonst anzeigen und den Lauf scheitern lassen
          foreach ($f in 'stderr.txt','stdout.txt') {
            $pf = Join-Path snapshots $f
            if ((Test-Path $pf) -and (Get-Item $pf).Length -eq 0) { Remove-Item $pf }
          }
          if (Test-Path snapshots\stderr.txt) { Get-Content snapshots\stderr.txt; exit 1 }
          if (Test-Path snapshots\errors.txt) { Get-Content snapshots\errors.txt; exit 1 }
          if (-not (Get-ChildItem snapshots -Filter *.png)) { exit 1 }

      # Zeitmessung: die echte EXE mehrmals starten, abwechselnd mit dem Stand vor den Optimierungen.
      # Der erste Lauf jeder Variante waermt nur auf, aus dem Rest wird der Median gebildet.
      - name: Zeitmessung (Start, Seitenwechsel, Listen)
        shell: powershell
        run: |
          .\build\build.ps1 | Out-Null
          $variants = [ordered]@{ nachher = @{ Exe = (Join-Path $pwd "dist\EdenUpdater.exe"); NoPrime = "" } }
          $variants["ohne-typen"] = @{ Exe = (Join-Path $pwd "dist\EdenUpdater.exe"); NoPrime = "1" }
          git fetch -q --depth 1 origin a34d1ab33440f4f88f3474a67881643187635891
          if ($LASTEXITCODE -eq 0) {
            git worktree add -f ..\base FETCH_HEAD
            & ..\base\build\build.ps1 | Out-Null
            $variants["vorher"] = @{ Exe = (Resolve-Path "..\base\dist\EdenUpdater.exe").Path; NoPrime = "" }
          }
          $env:EDEN_UPDATER_SNAPSHOT_PERF = (Join-Path $pwd "tests\perf-steps.ps1")
          $env:EDEN_UPDATER_SNAPSHOT_THEMES = "dark-cyan"
          $data = @{}
          foreach ($v in $variants.Keys) { $data[$v] = @{} }
          $order = New-Object System.Collections.ArrayList
          $infos = @()
          for ($i = 0; $i -le 7; $i++) {
            foreach ($v in $variants.Keys) {
              $dir = Join-Path $pwd "perf\$v-$i"
              New-Item -ItemType Directory $dir -Force | Out-Null
              $env:EDEN_UPDATER_SNAPSHOT = $dir
              $env:EDEN_UPDATER_NOPRIME = $variants[$v].NoPrime
              $p = Start-Process $variants[$v].Exe -PassThru
              if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "Timeout in Lauf $v $i" }
              if (Test-Path "$dir\errors.txt") { Write-Host "Fehler in Lauf $v $i"; Get-Content "$dir\errors.txt"; exit 1 }
              if (-not (Test-Path "$dir\perf.txt")) { Write-Host "perf.txt fehlt in Lauf $v $i"; exit 1 }
              if ($i -eq 0) { continue }
              foreach ($line in (Get-Content "$dir\perf.txt" -Encoding UTF8)) {
                $parts = $line -split "`t"
                if ($parts[0] -eq "I") { if ($i -eq 1) { $infos += ($v + ": " + $parts[1]) }; continue }
                $key = $parts[0] + "`t" + $parts[1]
                if (-not $order.Contains($key)) { [void]$order.Add($key) }
                if (-not $data[$v].ContainsKey($key)) { $data[$v][$key] = New-Object System.Collections.ArrayList }
                [void]$data[$v][$key].Add([double]$parts[2])
              }
            }
          }
          $env:EDEN_UPDATER_NOPRIME = ""
          function Med($l) { if (-not $l) { return "" }; $s = @($l | Sort-Object); return ("{0:F0}" -f $s[[int][Math]::Floor($s.Count / 2)]) }
          $out = @("Median aus 7 Laeufen je Variante, Millisekunden", "", ("{0,-3}{1,-58}{2,8}{3,9}{4,12}" -f "", "", "vorher", "nachher", "ohne-typen"))
          foreach ($key in $order) {
            $parts = $key -split "`t"
            $out += ("{0,-3}{1,-58}{2,8}{3,9}{4,12}" -f $parts[0], $parts[1], (Med $data["vorher"][$key]), (Med $data["nachher"][$key]), (Med $data["ohne-typen"][$key]))
          }
          $out += ""
          $out += $infos
          $out | Set-Content snapshots\timing.txt -Encoding UTF8
          Copy-Item "perf\nachher-7\perf-covers.png" snapshots\ -ErrorAction SilentlyContinue
          $out

      - name: Screenshots ablegen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Screenshots
          path: snapshots/

      - name: Screenshots in Branch 'screenshots' ablegen
        if: always() && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          [ -d snapshots ] || exit 0
          cd snapshots
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots von ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
